services:
  scraper:
    build:
      context: ./scraper
    image: maps-scraper-sidecar:latest
    container_name: maps_scraper_playwright
    restart: unless-stopped
    ports:
      - "${SCRAPER_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      TZ: "${TZ:-Asia/Jakarta}"
      DETAIL_CONCURRENCY: "${DETAIL_CONCURRENCY:-3}"
      DETAIL_BUDGET_MS: "${DETAIL_BUDGET_MS:-60000}"
      MAX_CONCURRENT_SCRAPES: "${MAX_CONCURRENT_SCRAPES:-4}"
      SHUTDOWN_GRACE_MS: "${SHUTDOWN_GRACE_MS:-10000}"
      BROWSER_IDLE_TIMEOUT_MS: "${BROWSER_IDLE_TIMEOUT_MS:-300000}"
      BROWSER_MAX_CONTEXTS: "${BROWSER_MAX_CONTEXTS:-200}"
      PLAYWRIGHT_WS_ENDPOINT: "${PLAYWRIGHT_WS_ENDPOINT:-}"
      PLAYWRIGHT_CDP_ENDPOINT: "${PLAYWRIGHT_CDP_ENDPOINT:-}"
    shm_size: "1gb"
    init: true
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  app:
    profiles: [ "app" ]
    build:
      context: .
    image: maps-scraper-app:latest
    container_name: maps_scraper_app
    restart: unless-stopped
    depends_on:
      scraper:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      SCRAPER_URL: "http://scraper:3000"
      SCRAPER_TIMEOUT_MS: "${SCRAPER_TIMEOUT_MS:-45000}"
      INSTAGRAM_TIMEOUT_MS: "${INSTAGRAM_TIMEOUT_MS:-45000}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?SECRET_KEY_BASE belum diisi - jalankan: mix phx.gen.secret}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      TZ: "${TZ:-Asia/Jakarta}"
      VALIDATION_CONCURRENCY: "${VALIDATION_CONCURRENCY:-3}"
      VALIDATION_MAX_ATTEMPTS: "${VALIDATION_MAX_ATTEMPTS:-3}"
      VALIDATION_BACKOFF_MS: "${VALIDATION_BACKOFF_MS:-1000}"
      VALIDATION_MAX_BACKOFF_MS: "${VALIDATION_MAX_BACKOFF_MS:-30000}"
      VALIDATION_MAX_BATCH: "${VALIDATION_MAX_BATCH:-500}"
      VALIDATION_JOB_TTL_MS: "${VALIDATION_JOB_TTL_MS:-900000}"
      VALIDATION_MAX_JOBS: "${VALIDATION_MAX_JOBS:-1000}"
      VALIDATION_MAX_CANDIDATES: "${VALIDATION_MAX_CANDIDATES:-5}"
      VALIDATION_MATCH_THRESHOLD: "${VALIDATION_MATCH_THRESHOLD:-0.8}"
      VALIDATION_REVIEW_THRESHOLD: "${VALIDATION_REVIEW_THRESHOLD:-0.3}"
      VALIDATION_AMBIGUITY_MARGIN: "${VALIDATION_AMBIGUITY_MARGIN:-0.1}"
    init: true

  # n8n — pemicu alur kerja yang memanggil API ini lewat HTTP.
  #
  # Berada di compose yang sama, jadi otomatis ikut jaringan `default` bersama
  # scraper dan app; tidak perlu konfigurasi network tambahan. Dari dalam n8n,
  # alamatnya cukup nama service:
  #
  #     http://app:4000/api/places
  #     http://app:4000/api/validations
  #
  # Jangan panggil `http://scraper:3000` langsung — itu sidecar internal tanpa
  # antrean, tanpa validasi parameter, dan tanpa vonis. Pintu masuknya `app`.
  #
  # Dua cara menjalankan, sesuai di mana Phoenix-nya hidup:
  #
  #   docker compose --profile app --profile n8n up -d
  #       Phoenix ikut di Docker -> pakai http://app:4000
  #
  #   docker compose --profile n8n up -d
  #       Phoenix dijalankan di host dengan `mix phx.server` -> pakai
  #       http://host.docker.internal:4000 (extra_hosts di bawah menyediakannya
  #       juga di Linux, yang tidak memilikinya secara bawaan)
  n8n:
    profiles: ["n8n"]
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    container_name: maps_scraper_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      TZ: "${TZ:-Asia/Jakarta}"
      GENERIC_TIMEZONE: "${TZ:-Asia/Jakarta}"
      N8N_PORT: "5678"
      N8N_HOST: "${N8N_HOST:-localhost}"
      # Kunci enkripsi kredensial. Dibiarkan kosong, n8n membuat sendiri dan
      # menyimpannya di volume — hilang bersama volume kalau volume dihapus.
      # Isi eksplisit kalau kredensialnya perlu selamat dari `down -v`.
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-}"
      # Dev diakses lewat http biasa, bukan https. Tanpa ini n8n menolak
      # mengirim cookie sesi saat host-nya bukan localhost. Jangan dibawa ke
      # produksi — di sana taruh n8n di belakang TLS dan hapus baris ini.
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
    volumes:
      - n8n_data:/home/node/.n8n
    # Supaya `host.docker.internal` juga bekerja di Linux, untuk kasus Phoenix
    # dijalankan di host alih-alih sebagai container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true

volumes:
  # Alur kerja, kredensial, dan riwayat eksekusi n8n. Dinamai supaya selamat dari
  # `docker compose down` — hanya `down -v` yang menghapusnya.
  n8n_data:
